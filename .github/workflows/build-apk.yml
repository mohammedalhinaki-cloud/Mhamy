name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/ea5fc608-mhamy
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Assemble signed debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mahami-v1.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish downloadable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.2.0"
          asset="Mahami-v1.2.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$asset" \
              --target "$GITHUB_SHA" \
              --title "مهامي 1.2.0 — التصنيفات والتقويم" \
              --notes "ثلاث تبويبات: مهامي مع فلاتر التصنيفات، مهام بموعد، وتقويم شهري بنقاط ملوّنة." \
              --repo "$GITHUB_REPOSITORY"
          fi
