name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/ea5fc608-mhamy
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Assemble signed debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee gradle-build.log

      - name: Publish APK artifact
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Mahami-v1.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish downloadable APK release
        if: steps.assemble.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-diagnostic --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          tag="v1.2.0"
          asset="Mahami-v1.2.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$asset" \
              --target "$GITHUB_SHA" \
              --title "مهامي 1.2.0 — التصنيفات والتقويم" \
              --notes "ثلاث تبويبات: مهامي مع فلاتر التصنيفات، مهام بموعد، وتقويم شهري بنقاط ملوّنة." \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Publish build diagnostic
        if: steps.assemble.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -E -C 2 '(^e: |error:|\.kt:[[:digit:]]+)' gradle-build.log > diagnostic-notes.txt; then
            tail -n 180 gradle-build.log > diagnostic-notes.txt
          fi
          gh release delete build-diagnostic --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create build-diagnostic \
            --target "$GITHUB_SHA" \
            --title "Temporary Android build diagnostic" \
            --notes-file diagnostic-notes.txt \
            --repo "$GITHUB_REPOSITORY"

      - name: Fail when the APK build failed
        if: steps.assemble.outcome == 'failure'
        run: exit 1
